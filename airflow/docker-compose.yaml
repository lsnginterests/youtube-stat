name: youtube-stat

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
  AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
  PYTHONPATH: /home/maxim/user/programming/youtube-stat
  S3_ENDPOINT_URL: http://minio:9000

x-airflow-common: &airflow-common
  image: youtube-stat/airflow:3.2.2
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ../.env
  environment: *airflow-env
  user: ${AIRFLOW_UID:-1000}:0
  networks:
    - default
    - minio
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    - /home/maxim/user/programming/youtube-stat:/home/maxim/user/programming/youtube-stat
    - /home/maxim/.ivy2:/home/airflow/.ivy2
  restart: always

x-airflow-depends: &airflow-depends
  postgres:
    condition: service_healthy
  airflow-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, airflow]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: 0:0
    restart: on-failure
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/dags /opt/airflow/logs /opt/airflow/config /opt/airflow/plugins
        chown -R "${AIRFLOW_UID:-1000}:0" /opt/airflow
        exec /entrypoint airflow version
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - 8081:8080
    healthcheck:
      test: [CMD, curl, --fail, 'http://localhost:8080/api/v2/monitor/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on: *airflow-depends

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: [CMD, curl, --fail, 'http://localhost:8974/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on: *airflow-depends

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on: *airflow-depends

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on: *airflow-depends

volumes:
  postgres-db-volume:

networks:
  default:
    name: youtube-stat-airflow
  minio:
    name: extract_load_default
    external: true
