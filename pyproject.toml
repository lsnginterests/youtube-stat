[project]
name = "youtube-stat"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "End-to-end ETL pipeline for YouTube Data API analytics"
readme = "README.md"
dependencies = [
    "boto3>=1.43.50",
    "google-api-python-client>=2.198.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extract_load"]
